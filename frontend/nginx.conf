# Вахта.ру — nginx для фронтенда (Vite + React, SPA).
# Два правила:
#   /api/*  — прокси на бэкенд (FastAPI)
#   остальное — SPA-fallback на index.html (маршруты React: /, /vacancy/)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
