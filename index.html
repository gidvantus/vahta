<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог вакансий — Вахта.ру</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================ Шапка ============================ -->
  <header class="header">
    <div class="header__inner">
      <a class="header__logo" href="#" aria-label="Вахта.ру — на главную">
        <img src="img/logo.svg" alt="Вахта.ру">
      </a>

      <form class="header__search" role="search" action="#" onsubmit="return false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="headerSearch" type="search" placeholder="Должность, компания или ключевое слово" aria-label="Поиск вакансий">
      </form>

      <div class="header__actions">
        <button class="icon-btn" type="button" aria-label="Уведомления">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="icon-btn__badge">3</span>
        </button>
        <a class="login-link" href="#">Вход</a>
        <a class="btn btn--primary" href="#">Разместить вакансию</a>
      </div>
    </div>
  </header>

  <!-- ========================= Раскладка =========================== -->
  <main class="layout">

    <!-- --------------------- Фильтры --------------------- -->
    <aside class="filters" aria-label="Фильтры вакансий">
      <div class="filter-groups">

        <section class="filter-group">
          <h2 class="filter-group__title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Город
          </h2>
          <input class="filter-input" id="citySearch" type="text" placeholder="Введите город" aria-label="Поиск города">
          <ul class="filter-list" id="cityList"></ul>
          <ul class="filter-list" id="cityExtraList"></ul>
          <button class="show-more hidden" id="cityMoreBtn" type="button">
            <span id="cityMoreLabel">Показать все</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </section>

        <section class="filter-group">
          <h2 class="filter-group__title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4h7a5 5 0 0 1 0 10H6M13 14l5 7"/></svg>
            Зарплата
          </h2>
          <ul class="filter-list" id="salaryList"></ul>
        </section>

        <section class="filter-group">
          <h2 class="filter-group__title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            График вахты
          </h2>
          <ul class="filter-list" id="scheduleList"></ul>
        </section>

      </div>

      <button class="btn btn--reset filters__reset" id="resetFilters" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Сбросить фильтры
      </button>
    </aside>

    <!-- --------------------- Результаты --------------------- -->
    <section class="results" aria-label="Список вакансий">
      <div class="results-bar">
        <p class="results-count">Найдено <b id="foundCount">0</b>&nbsp;<span id="foundWord">вакансий</span></p>

        <div class="sort" id="sortBtn" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
          <span id="sortLabel">По дате</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <div class="sort__menu" id="sortMenu">
            <button class="sort__option is-active" type="button" data-sort="date">По дате</button>
            <button class="sort__option" type="button" data-sort="salary-desc">По зарплате (сначала выше)</button>
            <button class="sort__option" type="button" data-sort="salary-asc">По зарплате (сначала ниже)</button>
          </div>
        </div>
      </div>

      <div class="vacancy-list" id="vacancyList"></div>
    </section>

  </main>

  <!-- ============================ Футер ============================ -->
  <footer class="footer">
    <div class="footer__inner">
      <a class="footer__logo" href="#" aria-label="Вахта.ру">
        <img src="img/logo.svg" alt="Вахта.ру">
      </a>
      <nav class="footer__nav" aria-label="Разделы">
        <a href="#">Вакансии</a>
      </nav>
      <p class="footer__copy">© 2026 Вахта.ру — работа вахтой по всей России</p>
    </div>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
