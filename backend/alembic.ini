[alembic]
script_location = alembic
prepend_sys_path = .

# URL берётся из переменной окружения DATABASE_URL (см. alembic/env.py),
# это значение — только fallback для локального запуска.
sqlalchemy.url = postgresql+psycopg://vahta:vahta@localhost:5432/vahta

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
